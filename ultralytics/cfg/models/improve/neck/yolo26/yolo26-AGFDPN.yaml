# Ultralytics YOLO26 AGFDPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [[10, 6, 4], 1, AlignmentGuidedFocusFeature, []] # 11-P4/16

  - [11, 1, Conv, [256, 3, 2]] # 12-P5/32
  - [[-1, 10], 1, Concat, [1]] # 13-P5/32
  - [-1, 2, C3k2, [512, True]] # 14-P5/32

  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 15-P3/8
  - [[-1, 4], 1, Concat, [1]] # 16-P3/8
  - [-1, 2, C3k2, [256, True]] # 17-P3/8

  - [[14, 11, 17], 1, AlignmentGuidedFocusFeature, []] # 18-P4/16

  - [18, 1, Conv, [256, 3, 2]] # 19-P5/32
  - [[12, 19, 14], 1, Concat, [1]] # 20-P5/32
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 21-P5/32

  - [18, 1, nn.Upsample, [None, 2, "nearest"]] # 22-P3/8
  - [[15, 22, 17], 1, Concat, [1]] # 23-P3/8
  - [-1, 2, C3k2, [256, True]] # 24-P3/8

  - [[24, 18, 21], 1, Detect, [nc]] # 25-P3/8,P4/16,P5/32
