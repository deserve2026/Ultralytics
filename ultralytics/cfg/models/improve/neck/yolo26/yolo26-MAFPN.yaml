# Ultralytics YOLO26 MAFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [6, 1, Conv, [256, 3, 2]] # 11-P5/32
  - [[-1, 10], 1, Concat, [1]] # 12-P5/32
  - [-1, 2, C3k2, [512, True]] # 13-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14-P4/16
  - [4, 1, Conv, [128, 3, 2]] # 15-P4/16
  - [[-1, -2, 6], 1, Concat, [1]] # 16-P4/16
  - [-1, 2, C3k2, [512, True]] # 17-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18-P3/8
  - [2, 1, Conv, [64, 3, 2]] # 19-P3/8
  - [[-1, -2, 4], 1, Concat, [1]] # 20-P3/8
  - [-1, 2, C3k2, [256, True]] # 21-P3/8

  - [[18, -1], 1, Concat, [1]] # 22-P3/8
  - [-1, 2, C3k2, [256, True]] # 23-P3/8

  - [21, 1, Conv, [256, 3, 2]] # 24-P4/16
  - [23, 1, Conv, [256, 3, 2]] # 25-P4/16
  - [[-1, -2, 17, 14], 1, Concat, [1]] # 26-P4/16
  - [-1, 2, C3k2, [512, True]] # 27-P4/16

  - [17, 1, Conv, [512, 3, 2]] # 28-P5/32
  - [27, 1, Conv, [512, 3, 2]] # 29-P5/32
  - [[-1, -2, 13], 1, Concat, [1]] # 30-P5/32
  - [-1, 1, C3k2, [512, True, 0.5, True]] # 31-P5/32

  - [[23, 27, 31], 1, Detect, [nc]] # 32-P3/8,P4/16,P5/32
