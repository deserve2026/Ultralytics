# Ultralytics YOLO26 BiFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [4, 1, Conv, [256]] # 11-P3/8
  - [6, 1, Conv, [256]] # 12-P4/16
  - [10, 1, Conv, [256]] # 13-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14-P4/16
  - [[-1, 12], 1, Fusion, [bifpn]] # 15-P4/16
  - [-1, 2, C3k2, [256, True]] # 16-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17-P3/8
  - [[-1, 11], 1, Fusion, [bifpn]] # 18-P3/8
  - [-1, 2, C3k2, [256, True]] # 19-P3/8

  - [2, 1, Conv, [256, 3, 2]] # 20-P3/8
  - [[-1, 11, 19], 1, Fusion, [bifpn]] # 21-P3/8
  - [-1, 2, C3k2, [256, True]] # 22-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 23-P4/16
  - [[-1, 12, 16], 1, Fusion, [bifpn]] # 24-P4/16
  - [-1, 2, C3k2, [256, True]] # 25-P4/16

  - [-1, 1, Conv, [256, 3, 2]] # 26-P5/32
  - [[-1, 13], 1, Fusion, [bifpn]] # 27-P5/32
  - [-1, 2, C3k2, [256, True]] # 28-P5/32

  - [[22, 25, 28], 1, Detect, [nc]] # 29-P3/8,P4/16,P5/32
