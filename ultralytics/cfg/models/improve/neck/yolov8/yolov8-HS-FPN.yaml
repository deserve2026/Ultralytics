# Ultralytics YOLOv8 HS-FPN neck model with P2/4 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [-1, 1, HFP, [None, [8, 8], False]] # 10-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11-P4/16
  - [6, 1, HFP, [None, [8, 8], False]] # 12-P4/16
  - [[-1, 11], 1, SDP, [512, [20, 20]]] # 13-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14-P3/8
  - [4, 1, HFP, [[0.25, 0.25], [8, 8], True]] # 15-P3/8
  - [[-1, 14], 1, SDP, [256, [20, 20]]] # 16-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17-P2/4
  - [2, 1, HFP, [[0.25, 0.25], [16, 16], True]] # 18-P2/4
  - [[-1, 17], 1, SDP, [128, [20, 20]]] # 19-P2/4

  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 20-P4/16
  - [-1, 1, Conv, [512, 1]] # 21-P4/16
  - [[-1, 13], 1, Add, []] # 22-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 23-P3/8
  - [-1, 1, Conv, [256, 1]] # 24-P3/8
  - [[-1, 16], 1, Add, []] # 25-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 26-P2/4
  - [-1, 1, Conv, [128, 1]] # 27-P2/4
  - [[-1, 19], 1, Add, []] # 28-P2/4

  - [10, 1, Conv, [1024, 3]] # 29-P5/32
  - [22, 1, Conv, [512, 3]] # 30-P4/16
  - [25, 1, Conv, [256, 3]] # 31-P3/8
  - [28, 1, Conv, [128, 3]] # 32-P2/4

  - [[32, 31, 30, 29], 1, Detect, [nc]] # 33-P2/4,P3/8,P4/16,P5/32
