# Ultralytics YOLOv8 hyper neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024, 6]
  s: [0.33, 0.50, 1024, 8]
  m: [0.67, 0.75, 768, 10]
  l: [1.00, 1.00, 512, 10]
  x: [1.00, 1.25, 512, 12]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [0, 1, nn.AvgPool2d, [8, 8, 0]] # 10-P4/16
  - [2, 1, nn.AvgPool2d, [4, 4, 0]] # 11-P4/16
  - [4, 1, nn.AvgPool2d, [2, 2, 0]] # 12-P4/16
  - [9, 1, nn.Upsample, [None, 2, "nearest"]] # 13-P4/16
  - [[10, 11, 12, 6, 13], 1, Concat, [1]] # 14-P4/16

  - [-1, 1, Conv, [512, 1, 1]] # 15-P4/16
  - [-1, 1, HyperComputeModule, [512]] # 16-P4/16
  - [-1, 3, MANet, [512, True, 2, 3]] # 17-P4/16

  - [17, 1, nn.AvgPool2d, [2, 2, 0]] # 18-P5/32
  - [[18, 9], 1, Concat, [1]] # 19-P5/32
  - [-1, 1, Conv, [1024, 1, 1]] # 20-P5/32

  - [[17, 6], 1, Concat, [1]] # 21-P4/16
  - [-1, 3, C2f, [512]] # 22-P4/16

  - [17, 1, nn.Upsample, [None, 2, "nearest"]] # 23-P3/8
  - [[23, 4], 1, Concat, [1]] # 24-P3/8
  - [-1, 3, C2f, [256]] # 25-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 26-P4/16
  - [[26, 22], 1, Concat, [1]] # 27-P4/16
  - [-1, 3, C2f, [512]] # 28-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 29-P5/32
  - [[29, 20], 1, Concat, [1]] # 30-P5/32
  - [-1, 3, C2f, [1024]] # 31-P5/32

  - [[25, 28, 31], 1, Detect, [nc]] # 32-P3/8,P4/16,P5/32
