# Ultralytics YOLOv8 GoldYOLO neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [[2, 4, 6, 9], 1, SimFusion_4in, []] # 10-P4/16
  - [-1, 1, IFM, [[64, 32]]] # 11-P4/16

  - [9, 1, Conv, [512, 1, 1]] # 12-P5/32
  - [[4, 6, -1], 1, SimFusion_3in, [512]] # 13-P4/16
  - [[-1, 11], 1, InjectionMultiSum_Auto_pool, [512, [64, 32], 0]] # 14-P4/16
  - [-1, 3, C2f, [512]] # 15-P4/16

  - [6, 1, Conv, [256, 1, 1]] # 16-P4/16
  - [[2, 4, -1], 1, SimFusion_3in, [256]] # 17-P3/8
  - [[-1, 11], 1, InjectionMultiSum_Auto_pool, [256, [64, 32], 1]] # 18-P3/8
  - [-1, 3, C2f, [256]] # 19-P3/8

  - [[19, 15, 9], 1, PyramidPoolAgg, [352, 2]] # 20-P6/64
  - [-1, 1, TopBasicLayer, [352, [64, 128]]] # 21-P6/64

  - [[19, 16], 1, AdvPoolFusion, []] # 22-P4/16
  - [[-1, 21], 1, InjectionMultiSum_Auto_pool, [256, [64, 128], 0]] # 23-P4/16
  - [-1, 3, C2f, [256]] # 24-P4/16

  - [[-1, 12], 1, AdvPoolFusion, []] # 25-P5/32
  - [[-1, 21], 1, InjectionMultiSum_Auto_pool, [512, [64, 128], 1]] # 26-P5/32
  - [-1, 3, C2f, [1024]] # 27-P5/32

  - [[19, 24, 27], 1, Detect, [nc]] # 28-P3/8,P4/16,P5/32
