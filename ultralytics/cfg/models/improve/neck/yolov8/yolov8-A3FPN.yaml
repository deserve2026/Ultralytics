# Ultralytics YOLOv8 A3FPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [4, 1, A3Conv, [256, 1, 1]] # 10-P3/8
  - [6, 1, A3Conv, [256, 1, 1]] # 11-P4/16
  - [9, 1, A3Conv, [256, 1, 1]] # 12-P5/32

  # A3Fusion2[level]: level 按输入列表 [[P4, P5]] 选择基准输出尺度，0=第1路 P4/16（将 P5 上采样 2x 对齐），1=第2路 P5/32（将 P4 下采样 2x 对齐）
  - [[11, 12], 1, A3Fusion2, [0]] # 13-P4/16
  - [[11, 12], 1, A3Fusion2, [1]] # 14-P5/32

  # A3Fusion3[level]: level 按输入列表 [[P3, P4, P5]] 选择基准输出尺度，0=输出 P3/8（P4 上采样 2x，P5 上采样 4x）
  # 1=输出 P4/16（P3 下采样 2x，P5 上采样 2x），2=输出 P5/32（P3 下采样 4x，P4 下采样 2x）
  - [[10, 13, 14], 1, A3Fusion3, [0]] # 15-P3/8
  - [[10, 13, 14], 1, A3Fusion3, [1]] # 16-P4/16
  - [[10, 13, 14], 1, A3Fusion3, [2]] # 17-P5/32

  - [15, 1, A3Conv, [256, 3, 1, 1]] # 18-P3/8
  - [16, 1, A3Conv, [256, 3, 1, 1]] # 19-P4/16
  - [17, 1, A3Conv, [256, 3, 1, 1]] # 20-P5/32

  - [[18, 19, 20], 1, Detect, [nc]] # 21-P3/8,P4/16,P5/32
