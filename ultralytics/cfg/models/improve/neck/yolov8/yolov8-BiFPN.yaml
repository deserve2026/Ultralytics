# Ultralytics YOLOv8 BiFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [4, 1, Conv, [256]] # 10-P3/8
  - [6, 1, Conv, [256]] # 11-P4/16
  - [9, 1, Conv, [256]] # 12-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13-P4/16
  - [[-1, 11], 1, Fusion, [bifpn]] # 14-P4/16
  - [-1, 3, C2f, [256]] # 15-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16-P3/8
  - [[-1, 10], 1, Fusion, [bifpn]] # 17-P3/8
  - [-1, 3, C2f, [256]] # 18-P3/8

  - [2, 1, Conv, [256, 3, 2]] # 19-P3/8
  - [[-1, 10, 18], 1, Fusion, [bifpn]] # 20-P3/8
  - [-1, 3, C2f, [256]] # 21-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 22-P4/16
  - [[-1, 11, 15], 1, Fusion, [bifpn]] # 23-P4/16
  - [-1, 3, C2f, [256]] # 24-P4/16

  - [-1, 1, Conv, [256, 3, 2]] # 25-P5/32
  - [[-1, 12], 1, Fusion, [bifpn]] # 26-P5/32
  - [-1, 3, C2f, [256]] # 27-P5/32

  - [[21, 24, 27], 1, Detect, [nc]] # 28-P3/8,P4/16,P5/32
