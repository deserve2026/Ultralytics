# Ultralytics YOLOv8 MAFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [6, 1, Conv, [256, 3, 2]] # 10-P5/32
  - [[-1, 9], 1, Concat, [1]] # 11-P5/32
  - [-1, 3, C2f, [512]] # 12-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13-P4/16
  - [4, 1, Conv, [128, 3, 2]] # 14-P4/16
  - [[-1, -2, 6], 1, Concat, [1]] # 15-P4/16
  - [-1, 3, C2f, [512]] # 16-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17-P3/8
  - [2, 1, Conv, [64, 3, 2]] # 18-P3/8
  - [[-1, -2, 4], 1, Concat, [1]] # 19-P3/8
  - [-1, 3, C2f, [256]] # 20-P3/8

  - [[18, -1], 1, Concat, [1]] # 21-P3/8
  - [-1, 3, C2f, [256]] # 22-P3/8

  - [20, 1, Conv, [256, 3, 2]] # 23-P4/16
  - [22, 1, Conv, [256, 3, 2]] # 24-P4/16
  - [[-1, -2, 16, 13], 1, Concat, [1]] # 25-P4/16
  - [-1, 3, C2f, [512]] # 26-P4/16

  - [16, 1, Conv, [512, 3, 2]] # 27-P5/32
  - [26, 1, Conv, [512, 3, 2]] # 28-P5/32
  - [[-1, -2, 12], 1, Concat, [1]] # 29-P5/32
  - [-1, 3, C2f, [512]] # 30-P5/32

  - [[22, 26, 30], 1, Detect, [nc]] # 31-P3/8,P4/16,P5/32
