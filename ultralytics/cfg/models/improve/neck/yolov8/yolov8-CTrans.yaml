# Ultralytics YOLOv8 CTrans neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [[4, 6, 9], 1, ChannelTransformer, []] # 10-P3/8,P4/16,P5/32
  - [10, 1, GetIndexOutput, [0]] # 11-P3/8
  - [10, 1, GetIndexOutput, [1]] # 12-P4/16
  - [10, 1, GetIndexOutput, [2]] # 13-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14-P4/16
  - [[-1, 6], 1, Concat, [1]] # 15-P4/16
  - [-1, 3, C2f, [512]] # 16-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17-P3/8
  - [[-1, 4], 1, Concat, [1]] # 18-P3/8
  - [-1, 3, C2f, [256]] # 19-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 20-P4/16
  - [[-1, 16], 1, Concat, [1]] # 21-P4/16
  - [-1, 3, C2f, [512]] # 22-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 23-P5/32
  - [[-1, 13], 1, Concat, [1]] # 24-P5/32
  - [-1, 3, C2f, [1024]] # 25-P5/32

  - [[19, 22, 25], 1, Detect, [nc]] # 26-P3/8,P4/16,P5/32
