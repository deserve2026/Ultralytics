# Ultralytics YOLOv8 ASF neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [-1, 1, Conv, [512, 1, 1]] # 10-P5/32
  - [4, 1, Conv, [512, 1, 1]] # 11-P3/8
  - [[-1, 6, -2], 1, Zoom_cat, []] # 12-P4/16
  - [-1, 3, C2f, [512]] # 13-P4/16

  - [-1, 1, Conv, [256, 1, 1]] # 14-P4/16
  - [2, 1, Conv, [256, 1, 1]] # 15-P2/4
  - [[-1, 4, -2], 1, Zoom_cat, []] # 16-P3/8
  - [-1, 3, C2f, [256]] # 17-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 18-P4/16
  - [[-1, 14], 1, Concat, [1]] # 19-P4/16
  - [-1, 3, C2f, [512]] # 20-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 21-P5/32
  - [[-1, 9], 1, Concat, [1]] # 22-P5/32
  - [-1, 3, C2f, [1024]] # 23-P5/32

  - [[4, 6, 8], 1, ScalSeq, [256]] # 24-P3/8
  - [[17, -1], 1, asf_attention_model, []] # 25-P3/8

  - [[25, 20, 23], 1, Detect, [nc]] # 26-P3/8,P4/16,P5/32
