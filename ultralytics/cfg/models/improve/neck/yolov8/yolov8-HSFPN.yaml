# Ultralytics YOLOv8 HSFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
head_channel: 256
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [-1, 1, ChannelAttention_HSFPN, []] # 10-P5/32
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 11-P5/32
  - [-1, 1, nn.ConvTranspose2d, [head_channel, 3, 2, 1, 1]] # 12-P4/16

  - [6, 1, ChannelAttention_HSFPN, []] # 13-P4/16
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 14-P4/16
  - [12, 1, ChannelAttention_HSFPN, [4, False]] # 15-/640
  - [[-1, -2], 1, Multiply, []] # 16-P4/16
  - [[-1, 12], 1, Add, []] # 17-P4/16
  - [-1, 3, C2f, [head_channel]] # 18-P4/16

  - [-1, 1, nn.ConvTranspose2d, [head_channel, 3, 2, 1, 1]] # 19-P3/8
  - [4, 1, ChannelAttention_HSFPN, []] # 20-P3/8
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 21-P3/8
  - [19, 1, ChannelAttention_HSFPN, [4, False]] # 22-/640
  - [[-1, -2], 1, Multiply, []] # 23-P3/8
  - [[-1, 19], 1, Add, []] # 24-P3/8
  - [-1, 3, C2f, [head_channel]] # 25-P3/8

  - [[25, 18, 11], 1, Detect, [nc]] # 26-P3/8,P4/16,P5/32
