# Ultralytics YOLOv8 GFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [-1, 1, Conv, [512, 1, 1]] # 10-P5/32
  - [6, 1, Conv, [512, 3, 2]] # 11-P5/32
  - [[-1, 10], 1, Concat, [1]] # 12-P5/32
  - [-1, 3, CSPStage, [512]] # 13-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14-P4/16
  - [4, 1, Conv, [256, 3, 2]] # 15-P4/16
  - [[14, -1, 6], 1, Concat, [1]] # 16-P4/16
  - [-1, 3, CSPStage, [512]] # 17-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18-P3/8
  - [[-1, 4], 1, Concat, [1]] # 19-P3/8
  - [-1, 3, CSPStage, [256]] # 20-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 21-P4/16
  - [[-1, 17], 1, Concat, [1]] # 22-P4/16
  - [-1, 3, CSPStage, [512]] # 23-P4/16

  - [17, 1, Conv, [256, 3, 2]] # 24-P5/32
  - [23, 1, Conv, [256, 3, 2]] # 25-P5/32
  - [[13, 24, -1], 1, Concat, [1]] # 26-P5/32
  - [-1, 3, CSPStage, [1024]] # 27-P5/32

  - [[20, 23, 27], 1, Detect, [nc]] # 28-P3/8,P4/16,P5/32
