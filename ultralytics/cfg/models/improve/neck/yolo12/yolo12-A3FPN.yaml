# Ultralytics YOLO12 A3FPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [4, 1, A3Conv, [256, 1, 1]] # 9-P3/8
  - [6, 1, A3Conv, [256, 1, 1]] # 10-P4/16
  - [8, 1, A3Conv, [256, 1, 1]] # 11-P5/32

  # A3Fusion2[level]: level 按输入列表 [[P4, P5]] 选择基准输出尺度，0=第1路 P4/16（将 P5 上采样 2x 对齐），1=第2路 P5/32（将 P4 下采样 2x 对齐）
  - [[10, 11], 1, A3Fusion2, [0]] # 12-P4/16
  - [[10, 11], 1, A3Fusion2, [1]] # 13-P5/32

  # A3Fusion3[level]: level 按输入列表 [[P3, P4, P5]] 选择基准输出尺度，0=输出 P3/8（P4 上采样 2x，P5 上采样 4x）
  # 1=输出 P4/16（P3 下采样 2x，P5 上采样 2x），2=输出 P5/32（P3 下采样 4x，P4 下采样 2x）
  - [[9, 12, 13], 1, A3Fusion3, [0]] # 14-P3/8
  - [[9, 12, 13], 1, A3Fusion3, [1]] # 15-P4/16
  - [[9, 12, 13], 1, A3Fusion3, [2]] # 16-P5/32

  - [14, 1, A3Conv, [256, 3, 1, 1]] # 17-P3/8
  - [15, 1, A3Conv, [256, 3, 1, 1]] # 18-P4/16
  - [16, 1, A3Conv, [256, 3, 1, 1]] # 19-P5/32

  - [[17, 18, 19], 1, Detect, [nc]] # 20-P3/8,P4/16,P5/32
