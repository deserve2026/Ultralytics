# Ultralytics YOLO12 hyper neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024, 6]
  s: [0.50, 0.50, 1024, 8]
  m: [0.50, 1.00, 512, 10]
  l: [1.00, 1.00, 512, 10]
  x: [1.00, 1.50, 512, 12]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [0, 1, nn.AvgPool2d, [8, 8, 0]] # 9-P4/16
  - [2, 1, nn.AvgPool2d, [4, 4, 0]] # 10-P4/16
  - [4, 1, nn.AvgPool2d, [2, 2, 0]] # 11-P4/16
  - [8, 1, nn.Upsample, [None, 2, "nearest"]] # 12-P4/16
  - [[9, 10, 11, 6, 12], 1, Concat, [1]] # 13-P4/16

  - [-1, 1, Conv, [512, 1, 1]] # 14-P4/16
  - [-1, 1, HyperComputeModule, [512]] # 15-P4/16
  - [-1, 3, MANet, [512, True, 2, 3]] # 16-P4/16

  - [16, 1, nn.AvgPool2d, [2, 2, 0]] # 17-P5/32
  - [[17, 8], 1, Concat, [1]] # 18-P5/32
  - [-1, 1, Conv, [1024, 1, 1]] # 19-P5/32

  - [[16, 6], 1, Concat, [1]] # 20-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 21-P4/16

  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 22-P3/8
  - [[22, 4], 1, Concat, [1]] # 23-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 24-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 25-P4/16
  - [[25, 21], 1, Concat, [1]] # 26-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 27-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 28-P5/32
  - [[28, 19], 1, Concat, [1]] # 29-P5/32
  - [-1, 2, C3k2, [1024, True]] # 30-P5/32

  - [[24, 27, 30], 1, Detect, [nc]] # 31-P3/8,P4/16,P5/32
