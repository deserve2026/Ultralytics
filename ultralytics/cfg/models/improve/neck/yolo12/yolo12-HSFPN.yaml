# Ultralytics YOLO12 HSFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
head_channel: 256
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [-1, 1, ChannelAttention_HSFPN, []] # 9-P5/32
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 10-P5/32
  - [-1, 1, nn.ConvTranspose2d, [head_channel, 3, 2, 1, 1]] # 11-P4/16

  - [6, 1, ChannelAttention_HSFPN, []] # 12-P4/16
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 13-P4/16
  - [11, 1, ChannelAttention_HSFPN, [4, False]] # 14-/640
  - [[-1, -2], 1, Multiply, []] # 15-P4/16
  - [[-1, 11], 1, Add, []] # 16-P4/16
  - [-1, 2, A2C2f, [head_channel, False, -1, "v1"]] # 17-P4/16

  - [-1, 1, nn.ConvTranspose2d, [head_channel, 3, 2, 1, 1]] # 18-P3/8
  - [4, 1, ChannelAttention_HSFPN, []] # 19-P3/8
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 20-P3/8
  - [18, 1, ChannelAttention_HSFPN, [4, False]] # 21-/640
  - [[-1, -2], 1, Multiply, []] # 22-P3/8
  - [[-1, 18], 1, Add, []] # 23-P3/8
  - [-1, 2, A2C2f, [head_channel, False, -1, "v1"]] # 24-P3/8

  - [[24, 17, 10], 1, Detect, [nc]] # 25-P3/8,P4/16,P5/32
