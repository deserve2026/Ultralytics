# Ultralytics YOLO12 CTrans P6 neck model with P3/8 - P6/64 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [768, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [768, True, 1, "v1"]] # 8-P5/32
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P6/64
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 10-P6/64

head:
  - [[4, 6, 8, 10], 1, ChannelTransformer, []] # 11-P3/8,P4/16,P5/32,P6/64
  - [11, 1, GetIndexOutput, [0]] # 12-P3/8
  - [11, 1, GetIndexOutput, [1]] # 13-P4/16
  - [11, 1, GetIndexOutput, [2]] # 14-P5/32
  - [11, 1, GetIndexOutput, [3]] # 15-P6/64

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16-P5/32
  - [[-1, 14], 1, Concat, [1]] # 17-P5/32
  - [-1, 2, A2C2f, [768, False, -1, "v1"]] # 18-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19-P4/16
  - [[-1, 13], 1, Concat, [1]] # 20-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 21-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 22-P3/8
  - [[-1, 12], 1, Concat, [1]] # 23-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 24-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 25-P4/16
  - [[-1, 20], 1, Concat, [1]] # 26-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 27-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 28-P5/32
  - [[-1, 17], 1, Concat, [1]] # 29-P5/32
  - [-1, 2, A2C2f, [768, False, -1, "v1"]] # 30-P5/32

  - [-1, 1, Conv, [512, 3, 2]] # 31-P6/64
  - [[-1, 15], 1, Concat, [1]] # 32-P6/64
  - [-1, 2, C3k2, [1024, True]] # 33-P6/64

  - [[23, 26, 29, 32], 1, Detect, [nc]] # 34-P3/8,P4/16,P5/32,P6/64
