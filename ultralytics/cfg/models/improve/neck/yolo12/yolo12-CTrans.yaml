# Ultralytics YOLO12 CTrans neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [[4, 6, 8], 1, ChannelTransformer, []] # 9-P3/8,P4/16,P5/32
  - [9, 1, GetIndexOutput, [0]] # 10-P3/8
  - [9, 1, GetIndexOutput, [1]] # 11-P4/16
  - [9, 1, GetIndexOutput, [2]] # 12-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13-P4/16
  - [[-1, 6], 1, Concat, [1]] # 14-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 15-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16-P3/8
  - [[-1, 4], 1, Concat, [1]] # 17-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 18-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 19-P4/16
  - [[-1, 15], 1, Concat, [1]] # 20-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 21-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 22-P5/32
  - [[-1, 12], 1, Concat, [1]] # 23-P5/32
  - [-1, 2, C3k2, [1024, True]] # 24-P5/32

  - [[18, 21, 24], 1, Detect, [nc]] # 25-P3/8,P4/16,P5/32
