# Ultralytics YOLO12 EfficientRepBiPAN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [-1, 1, Conv, [256]] # 9-P5/32
  - [[-1, 6, 4], 1, BiFusion, [256]] # 10-P4/16
  - [-1, 12, RepBlock, [256]] # 11-P4/16

  - [-1, 1, Conv, [128]] # 12-P4/16
  - [[-1, 4, 2], 1, BiFusion, [128]] # 13-P3/8
  - [-1, 12, RepBlock, [128]] # 14-P3/8

  - [-1, 1, Conv, [128, 3, 2]] # 15-P4/16
  - [[-1, 11], 1, Concat, [1]] # 16-P4/16
  - [-1, 12, RepBlock, [256]] # 17-P4/16

  - [-1, 1, Conv, [256, 3, 2]] # 18-P5/32
  - [[-1, 8], 1, Concat, [1]] # 19-P5/32
  - [-1, 12, RepBlock, [512]] # 20-P5/32

  - [[14, 17, 20], 1, Detect, [nc]] # 21-P3/8,P4/16,P5/32
