# Ultralytics YOLO12 MAFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [6, 1, Conv, [256, 3, 2]] # 9-P5/32
  - [[-1, 8], 1, Concat, [1]] # 10-P5/32
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 11-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12-P4/16
  - [4, 1, Conv, [128, 3, 2]] # 13-P4/16
  - [[-1, -2, 6], 1, Concat, [1]] # 14-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 15-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16-P3/8
  - [2, 1, Conv, [64, 3, 2]] # 17-P3/8
  - [[-1, -2, 4], 1, Concat, [1]] # 18-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 19-P3/8

  - [[18, -1], 1, Concat, [1]] # 20-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 21-P3/8

  - [19, 1, Conv, [256, 3, 2]] # 22-P4/16
  - [21, 1, Conv, [256, 3, 2]] # 23-P4/16
  - [[-1, -2, 15, 12], 1, Concat, [1]] # 24-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 25-P4/16

  - [15, 1, Conv, [512, 3, 2]] # 26-P5/32
  - [25, 1, Conv, [512, 3, 2]] # 27-P5/32
  - [[-1, -2, 11], 1, Concat, [1]] # 28-P5/32
  - [-1, 2, C3k2, [512, True]] # 29-P5/32

  - [[21, 25, 29], 1, Detect, [nc]] # 30-P3/8,P4/16,P5/32
