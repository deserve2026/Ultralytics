# Ultralytics YOLO12 BiFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [4, 1, Conv, [256]] # 9-P3/8
  - [6, 1, Conv, [256]] # 10-P4/16
  - [8, 1, Conv, [256]] # 11-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12-P4/16
  - [[-1, 10], 1, Fusion, [bifpn]] # 13-P4/16
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 14-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15-P3/8
  - [[-1, 9], 1, Fusion, [bifpn]] # 16-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 17-P3/8

  - [2, 1, Conv, [256, 3, 2]] # 18-P3/8
  - [[-1, 9, 17], 1, Fusion, [bifpn]] # 19-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 20-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 21-P4/16
  - [[-1, 10, 14], 1, Fusion, [bifpn]] # 22-P4/16
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 23-P4/16

  - [-1, 1, Conv, [256, 3, 2]] # 24-P5/32
  - [[-1, 11], 1, Fusion, [bifpn]] # 25-P5/32
  - [-1, 2, C3k2, [256, True]] # 26-P5/32

  - [[20, 23, 26], 1, Detect, [nc]] # 27-P3/8,P4/16,P5/32
