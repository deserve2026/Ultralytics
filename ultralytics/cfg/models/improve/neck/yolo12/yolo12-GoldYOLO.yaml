# Ultralytics YOLO12 GoldYOLO neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [[2, 4, 6, 8], 1, SimFusion_4in, []] # 9-P4/16
  - [-1, 1, IFM, [[64, 32]]] # 10-P4/16

  - [8, 1, Conv, [512, 1, 1]] # 11-P5/32
  - [[4, 6, -1], 1, SimFusion_3in, [512]] # 12-P4/16
  - [[-1, 10], 1, InjectionMultiSum_Auto_pool, [512, [64, 32], 0]] # 13-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 14-P4/16

  - [6, 1, Conv, [256, 1, 1]] # 15-P4/16
  - [[2, 4, -1], 1, SimFusion_3in, [256]] # 16-P3/8
  - [[-1, 10], 1, InjectionMultiSum_Auto_pool, [256, [64, 32], 1]] # 17-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 18-P3/8

  - [[18, 14, 8], 1, PyramidPoolAgg, [352, 2]] # 19-P6/64
  - [-1, 1, TopBasicLayer, [352, [64, 128]]] # 20-P6/64

  - [[18, 15], 1, AdvPoolFusion, []] # 21-P4/16
  - [[-1, 20], 1, InjectionMultiSum_Auto_pool, [256, [64, 128], 0]] # 22-P4/16
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 23-P4/16

  - [[-1, 11], 1, AdvPoolFusion, []] # 24-P5/32
  - [[-1, 20], 1, InjectionMultiSum_Auto_pool, [512, [64, 128], 1]] # 25-P5/32
  - [-1, 2, C3k2, [1024, True]] # 26-P5/32

  - [[18, 23, 26], 1, Detect, [nc]] # 27-P3/8,P4/16,P5/32
