# Ultralytics YOLO12 HS-FPN neck model with P2/4 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [-1, 1, HFP, [None, [8, 8], False]] # 9-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10-P4/16
  - [6, 1, HFP, [None, [8, 8], False]] # 11-P4/16
  - [[-1, 10], 1, SDP, [512, [20, 20]]] # 12-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13-P3/8
  - [4, 1, HFP, [[0.25, 0.25], [8, 8], True]] # 14-P3/8
  - [[-1, 13], 1, SDP, [256, [20, 20]]] # 15-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16-P2/4
  - [2, 1, HFP, [[0.25, 0.25], [16, 16], True]] # 17-P2/4
  - [[-1, 16], 1, SDP, [128, [20, 20]]] # 18-P2/4

  - [9, 1, nn.Upsample, [None, 2, "nearest"]] # 19-P4/16
  - [-1, 1, Conv, [512, 1]] # 20-P4/16
  - [[-1, 12], 1, Add, []] # 21-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 22-P3/8
  - [-1, 1, Conv, [256, 1]] # 23-P3/8
  - [[-1, 15], 1, Add, []] # 24-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 25-P2/4
  - [-1, 1, Conv, [128, 1]] # 26-P2/4
  - [[-1, 18], 1, Add, []] # 27-P2/4

  - [9, 1, Conv, [1024, 3]] # 28-P5/32
  - [21, 1, Conv, [512, 3]] # 29-P4/16
  - [24, 1, Conv, [256, 3]] # 30-P3/8
  - [27, 1, Conv, [128, 3]] # 31-P2/4

  - [[31, 30, 29, 28], 1, Detect, [nc]] # 32-P2/4,P3/8,P4/16,P5/32
