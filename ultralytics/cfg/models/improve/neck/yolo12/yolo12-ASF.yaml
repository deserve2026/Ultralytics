# Ultralytics YOLO12 ASF neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4, "v1"]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1, "v1"]] # 8-P5/32

head:
  - [-1, 1, Conv, [512, 1, 1]] # 9-P5/32
  - [4, 1, Conv, [512, 1, 1]] # 10-P3/8
  - [[-1, 6, -2], 1, Zoom_cat, []] # 11-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 12-P4/16

  - [-1, 1, Conv, [256, 1, 1]] # 13-P4/16
  - [2, 1, Conv, [256, 1, 1]] # 14-P2/4
  - [[-1, 4, -2], 1, Zoom_cat, []] # 15-P3/8
  - [-1, 2, A2C2f, [256, False, -1, "v1"]] # 16-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 17-P4/16
  - [[-1, 13], 1, Concat, [1]] # 18-P4/16
  - [-1, 2, A2C2f, [512, False, -1, "v1"]] # 19-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 20-P5/32
  - [[-1, 8], 1, Concat, [1]] # 21-P5/32
  - [-1, 2, C3k2, [1024, True]] # 22-P5/32

  - [[4, 6, 8], 1, ScalSeq, [256]] # 23-P3/8
  - [[16, -1], 1, asf_attention_model, []] # 24-P3/8

  - [[24, 19, 22], 1, Detect, [nc]] # 25-P3/8,P4/16,P5/32
