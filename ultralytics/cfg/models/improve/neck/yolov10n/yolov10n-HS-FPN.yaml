# Ultralytics YOLOv10n HS-FPN neck model with P2/4 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

head:
  - [-1, 1, HFP, [None, [8, 8], False]] # 11-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12-P4/16
  - [6, 1, HFP, [None, [8, 8], False]] # 13-P4/16
  - [[-1, 12], 1, SDP, [512, [20, 20]]] # 14-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15-P3/8
  - [4, 1, HFP, [[0.25, 0.25], [8, 8], True]] # 16-P3/8
  - [[-1, 15], 1, SDP, [256, [20, 20]]] # 17-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18-P2/4
  - [2, 1, HFP, [[0.25, 0.25], [16, 16], True]] # 19-P2/4
  - [[-1, 18], 1, SDP, [128, [20, 20]]] # 20-P2/4

  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 21-P4/16
  - [-1, 1, Conv, [512, 1]] # 22-P4/16
  - [[-1, 14], 1, Add, []] # 23-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 24-P3/8
  - [-1, 1, Conv, [256, 1]] # 25-P3/8
  - [[-1, 17], 1, Add, []] # 26-P3/8

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 27-P2/4
  - [-1, 1, Conv, [128, 1]] # 28-P2/4
  - [[-1, 20], 1, Add, []] # 29-P2/4

  - [11, 1, Conv, [1024, 3]] # 30-P5/32
  - [23, 1, Conv, [512, 3]] # 31-P4/16
  - [26, 1, Conv, [256, 3]] # 32-P3/8
  - [29, 1, Conv, [128, 3]] # 33-P2/4

  - [[33, 32, 31, 30], 1, v10Detect, [nc]] # 34-P2/4,P3/8,P4/16,P5/32
