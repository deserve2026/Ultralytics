# Ultralytics YOLOv10n ASF neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

head:
  - [-1, 1, Conv, [512, 1, 1]] # 11-P5/32
  - [4, 1, Conv, [512, 1, 1]] # 12-P3/8
  - [[-1, 6, -2], 1, Zoom_cat, []] # 13-P4/16
  - [-1, 3, C2f, [512]] # 14-P4/16

  - [-1, 1, Conv, [256, 1, 1]] # 15-P4/16
  - [2, 1, Conv, [256, 1, 1]] # 16-P2/4
  - [[-1, 4, -2], 1, Zoom_cat, []] # 17-P3/8
  - [-1, 3, C2f, [256]] # 18-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 19-P4/16
  - [[-1, 15], 1, Concat, [1]] # 20-P4/16
  - [-1, 3, C2f, [512]] # 21-P4/16

  - [-1, 1, SCDown, [512, 3, 2]] # 22-P5/32
  - [[-1, 10], 1, Concat, [1]] # 23-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]] # 24-P5/32

  - [[4, 6, 8], 1, ScalSeq, [256]] # 25-P3/8
  - [[18, -1], 1, asf_attention_model, []] # 26-P3/8

  - [[26, 21, 24], 1, v10Detect, [nc]] # 27-P3/8,P4/16,P5/32
