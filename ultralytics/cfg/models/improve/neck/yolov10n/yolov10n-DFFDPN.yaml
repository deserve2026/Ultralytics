# Ultralytics YOLOv10n DFFDPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

head:
  - [[10, 6, 4], 1, DynamicFrequencyFocusFeature, []] # 11-P4/16

  - [11, 1, SCDown, [256, 3, 2]] # 12-P5/32
  - [[-1, 10], 1, Concat, [1]] # 13-P5/32
  - [-1, 3, C2f, [512]] # 14-P5/32

  - [11, 1, nn.Upsample, [None, 2, "nearest"]] # 15-P3/8
  - [[-1, 4], 1, Concat, [1]] # 16-P3/8
  - [-1, 3, C2f, [256]] # 17-P3/8

  - [[14, 11, 17], 1, DynamicFrequencyFocusFeature, []] # 18-P4/16

  - [18, 1, SCDown, [256, 3, 2]] # 19-P5/32
  - [[12, 19, 14], 1, Concat, [1]] # 20-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]] # 21-P5/32

  - [18, 1, nn.Upsample, [None, 2, "nearest"]] # 22-P3/8
  - [[15, 22, 17], 1, Concat, [1]] # 23-P3/8
  - [-1, 3, C2f, [256]] # 24-P3/8

  - [[24, 18, 21], 1, v10Detect, [nc]] # 25-P3/8,P4/16,P5/32
