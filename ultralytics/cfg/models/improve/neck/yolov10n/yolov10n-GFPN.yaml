# Ultralytics YOLOv10n GFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

head:
  - [-1, 1, Conv, [512, 1, 1]] # 11-P5/32
  - [6, 1, Conv, [512, 3, 2]] # 12-P5/32
  - [[-1, 11], 1, Concat, [1]] # 13-P5/32
  - [-1, 3, CSPStage, [512]] # 14-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15-P4/16
  - [4, 1, Conv, [256, 3, 2]] # 16-P4/16
  - [[15, -1, 6], 1, Concat, [1]] # 17-P4/16
  - [-1, 3, CSPStage, [512]] # 18-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 19-P3/8
  - [[-1, 4], 1, Concat, [1]] # 20-P3/8
  - [-1, 3, CSPStage, [256]] # 21-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 22-P4/16
  - [[-1, 18], 1, Concat, [1]] # 23-P4/16
  - [-1, 3, CSPStage, [512]] # 24-P4/16

  - [18, 1, Conv, [256, 3, 2]] # 25-P5/32
  - [24, 1, Conv, [256, 3, 2]] # 26-P5/32
  - [[14, 25, -1], 1, Concat, [1]] # 27-P5/32
  - [-1, 3, CSPStage, [1024]] # 28-P5/32

  - [[21, 24, 28], 1, v10Detect, [nc]] # 29-P3/8,P4/16,P5/32
