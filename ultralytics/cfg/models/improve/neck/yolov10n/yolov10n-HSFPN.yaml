# Ultralytics YOLOv10n HSFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
head_channel: 256
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

head:
  - [-1, 1, ChannelAttention_HSFPN, []] # 11-P5/32
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 12-P5/32
  - [-1, 1, nn.ConvTranspose2d, [head_channel, 3, 2, 1, 1]] # 13-P4/16

  - [6, 1, ChannelAttention_HSFPN, []] # 14-P4/16
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 15-P4/16
  - [13, 1, ChannelAttention_HSFPN, [4, False]] # 16-/640
  - [[-1, -2], 1, Multiply, []] # 17-P4/16
  - [[-1, 13], 1, Add, []] # 18-P4/16
  - [-1, 3, C2f, [head_channel]] # 19-P4/16

  - [-1, 1, nn.ConvTranspose2d, [head_channel, 3, 2, 1, 1]] # 20-P3/8
  - [4, 1, ChannelAttention_HSFPN, []] # 21-P3/8
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 22-P3/8
  - [20, 1, ChannelAttention_HSFPN, [4, False]] # 23-/640
  - [[-1, -2], 1, Multiply, []] # 24-P3/8
  - [[-1, 20], 1, Add, []] # 25-P3/8
  - [-1, 3, C2f, [head_channel]] # 26-P3/8

  - [[26, 19, 12], 1, v10Detect, [nc]] # 27-P3/8,P4/16,P5/32
