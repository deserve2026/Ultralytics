# Ultralytics YOLOv10n GoldYOLO neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

head:
  - [[2, 4, 6, 10], 1, SimFusion_4in, []] # 11-P4/16
  - [-1, 1, IFM, [[64, 32]]] # 12-P4/16

  - [10, 1, Conv, [512, 1, 1]] # 13-P5/32
  - [[4, 6, -1], 1, SimFusion_3in, [512]] # 14-P4/16
  - [[-1, 12], 1, InjectionMultiSum_Auto_pool, [512, [64, 32], 0]] # 15-P4/16
  - [-1, 3, C2f, [512]] # 16-P4/16

  - [6, 1, Conv, [256, 1, 1]] # 17-P4/16
  - [[2, 4, -1], 1, SimFusion_3in, [256]] # 18-P3/8
  - [[-1, 12], 1, InjectionMultiSum_Auto_pool, [256, [64, 32], 1]] # 19-P3/8
  - [-1, 3, C2f, [256]] # 20-P3/8

  - [[20, 16, 10], 1, PyramidPoolAgg, [352, 2]] # 21-P6/64
  - [-1, 1, TopBasicLayer, [352, [64, 128]]] # 22-P6/64

  - [[20, 17], 1, AdvPoolFusion, []] # 23-P4/16
  - [[-1, 22], 1, InjectionMultiSum_Auto_pool, [256, [64, 128], 0]] # 24-P4/16
  - [-1, 3, C2f, [256]] # 25-P4/16

  - [[-1, 13], 1, AdvPoolFusion, []] # 26-P5/32
  - [[-1, 22], 1, InjectionMultiSum_Auto_pool, [512, [64, 128], 1]] # 27-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]] # 28-P5/32

  - [[20, 25, 28], 1, v10Detect, [nc]] # 29-P3/8,P4/16,P5/32
