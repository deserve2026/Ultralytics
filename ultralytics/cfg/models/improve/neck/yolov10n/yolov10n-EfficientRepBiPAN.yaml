# Ultralytics YOLOv10n EfficientRepBiPAN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

head:
  - [-1, 1, Conv, [256]] # 11-P5/32
  - [[-1, 6, 4], 1, BiFusion, [256]] # 12-P4/16
  - [-1, 12, RepBlock, [256]] # 13-P4/16

  - [-1, 1, Conv, [128]] # 14-P4/16
  - [[-1, 4, 2], 1, BiFusion, [128]] # 15-P3/8
  - [-1, 12, RepBlock, [128]] # 16-P3/8

  - [-1, 1, Conv, [128, 3, 2]] # 17-P4/16
  - [[-1, 13], 1, Concat, [1]] # 18-P4/16
  - [-1, 12, RepBlock, [256]] # 19-P4/16

  - [-1, 1, Conv, [256, 3, 2]] # 20-P5/32
  - [[-1, 10], 1, Concat, [1]] # 21-P5/32
  - [-1, 12, RepBlock, [512]] # 22-P5/32

  - [[16, 19, 22], 1, v10Detect, [nc]] # 23-P3/8,P4/16,P5/32
