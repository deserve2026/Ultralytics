# Ultralytics YOLO11 hyper neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024, 6]
  s: [0.50, 0.50, 1024, 8]
  m: [0.50, 1.00, 512, 10]
  l: [1.00, 1.00, 512, 10]
  x: [1.00, 1.50, 512, 12]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [0, 1, nn.AvgPool2d, [8, 8, 0]] # 11-P4/16
  - [2, 1, nn.AvgPool2d, [4, 4, 0]] # 12-P4/16
  - [4, 1, nn.AvgPool2d, [2, 2, 0]] # 13-P4/16
  - [10, 1, nn.Upsample, [None, 2, "nearest"]] # 14-P4/16
  - [[11, 12, 13, 6, 14], 1, Concat, [1]] # 15-P4/16

  - [-1, 1, Conv, [512, 1, 1]] # 16-P4/16
  - [-1, 1, HyperComputeModule, [512]] # 17-P4/16
  - [-1, 3, MANet, [512, True, 2, 3]] # 18-P4/16

  - [18, 1, nn.AvgPool2d, [2, 2, 0]] # 19-P5/32
  - [[19, 10], 1, Concat, [1]] # 20-P5/32
  - [-1, 1, Conv, [1024, 1, 1]] # 21-P5/32

  - [[18, 6], 1, Concat, [1]] # 22-P4/16
  - [-1, 2, C3k2, [512, False]] # 23-P4/16

  - [18, 1, nn.Upsample, [None, 2, "nearest"]] # 24-P3/8
  - [[24, 4], 1, Concat, [1]] # 25-P3/8
  - [-1, 2, C3k2, [256, False]] # 26-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 27-P4/16
  - [[27, 23], 1, Concat, [1]] # 28-P4/16
  - [-1, 2, C3k2, [512, False]] # 29-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 30-P5/32
  - [[30, 21], 1, Concat, [1]] # 31-P5/32
  - [-1, 2, C3k2, [1024, True]] # 32-P5/32

  - [[26, 29, 32], 1, Detect, [nc]] # 33-P3/8,P4/16,P5/32
