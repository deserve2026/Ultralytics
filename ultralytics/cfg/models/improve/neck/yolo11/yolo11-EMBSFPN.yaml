# Ultralytics YOLO11 EMBSFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [4, 1, Conv, [256]] # 11-P3/8
  - [6, 1, Conv, [256]] # 12-P4/16
  - [10, 1, Conv, [256]] # 13-P5/32

  - [12, 1, Conv, [256, 3, 2]] # 14-P5/32
  - [[-1, 13], 1, Fusion, [bifpn]] # 15-P5/32
  - [-1, 3, CSP_MSCB, [256, [5, 7, 9]]] # 16-P5/32

  - [-1, 1, EUCB, []] # 17-P4/16
  - [11, 1, Conv, [256, 3, 2]] # 18-P4/16
  - [[-1, -2, 12], 1, Fusion, [bifpn]] # 19-P4/16
  - [-1, 3, CSP_MSCB, [256, [3, 5, 7]]] # 20-P4/16

  - [-1, 1, EUCB, []] # 21-P3/8
  - [2, 1, Conv, [256, 3, 2]] # 22-P3/8
  - [[-1, -2, 11], 1, Fusion, [bifpn]] # 23-P3/8
  - [-1, 3, CSP_MSCB, [256, [1, 3, 5]]] # 24-P3/8

  - [[21, -1], 1, Fusion, [bifpn]] # 25-P3/8
  - [-1, 3, CSP_MSCB, [256, [1, 3, 5]]] # 26-P3/8

  - [24, 1, Conv, [256, 3, 2]] # 27-P4/16
  - [26, 1, Conv, [256, 3, 2]] # 28-P4/16
  - [[-1, -2, 20, 17], 1, Fusion, [bifpn]] # 29-P4/16
  - [-1, 3, CSP_MSCB, [256, [3, 5, 7]]] # 30-P4/16

  - [20, 1, Conv, [256, 3, 2]] # 31-P5/32
  - [30, 1, Conv, [256, 3, 2]] # 32-P5/32
  - [[-1, -2, 16], 1, Fusion, [bifpn]] # 33-P5/32
  - [-1, 3, CSP_MSCB, [256, [5, 7, 9]]] # 34-P5/32

  - [[26, 30, 34], 1, Detect, [nc]] # 35-P3/8,P4/16,P5/32
