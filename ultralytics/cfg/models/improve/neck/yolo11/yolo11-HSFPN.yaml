# Ultralytics YOLO11 HSFPN neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
head_channel: 256
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [-1, 1, ChannelAttention_HSFPN, []] # 11-P5/32
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 12-P5/32
  - [-1, 1, nn.ConvTranspose2d, [head_channel, 3, 2, 1, 1]] # 13-P4/16

  - [6, 1, ChannelAttention_HSFPN, []] # 14-P4/16
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 15-P4/16
  - [13, 1, ChannelAttention_HSFPN, [4, False]] # 16-/640
  - [[-1, -2], 1, Multiply, []] # 17-P4/16
  - [[-1, 13], 1, Add, []] # 18-P4/16
  - [-1, 2, C3k2, [head_channel, False]] # 19-P4/16

  - [-1, 1, nn.ConvTranspose2d, [head_channel, 3, 2, 1, 1]] # 20-P3/8
  - [4, 1, ChannelAttention_HSFPN, []] # 21-P3/8
  - [-1, 1, nn.Conv2d, [head_channel, 1]] # 22-P3/8
  - [20, 1, ChannelAttention_HSFPN, [4, False]] # 23-/640
  - [[-1, -2], 1, Multiply, []] # 24-P3/8
  - [[-1, 20], 1, Add, []] # 25-P3/8
  - [-1, 2, C3k2, [head_channel, False]] # 26-P3/8

  - [[26, 19, 12], 1, Detect, [nc]] # 27-P3/8,P4/16,P5/32
