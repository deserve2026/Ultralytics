# Ultralytics YOLO11 CTrans P6 neck model with P3/8 - P6/64 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [768, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [768, True]] # 8-P5/32
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P6/64
  - [-1, 2, C3k2, [1024, True]] # 10-P6/64
  - [-1, 1, SPPF, [1024, 5]] # 11-P6/64
  - [-1, 2, C2PSA, [1024]] # 12-P6/64

head:
  - [[4, 6, 8, 12], 1, ChannelTransformer, []] # 13-P3/8,P4/16,P5/32,P6/64
  - [13, 1, GetIndexOutput, [0]] # 14-P3/8
  - [13, 1, GetIndexOutput, [1]] # 15-P4/16
  - [13, 1, GetIndexOutput, [2]] # 16-P5/32
  - [13, 1, GetIndexOutput, [3]] # 17-P6/64

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18-P5/32
  - [[-1, 16], 1, Concat, [1]] # 19-P5/32
  - [-1, 2, C3k2, [768, False]] # 20-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 21-P4/16
  - [[-1, 15], 1, Concat, [1]] # 22-P4/16
  - [-1, 2, C3k2, [512, False]] # 23-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 24-P3/8
  - [[-1, 14], 1, Concat, [1]] # 25-P3/8
  - [-1, 2, C3k2, [256, False]] # 26-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 27-P4/16
  - [[-1, 23], 1, Concat, [1]] # 28-P4/16
  - [-1, 2, C3k2, [512, False]] # 29-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 30-P5/32
  - [[-1, 20], 1, Concat, [1]] # 31-P5/32
  - [-1, 2, C3k2, [768, True]] # 32-P5/32

  - [-1, 1, Conv, [512, 3, 2]] # 33-P6/64
  - [[-1, 17], 1, Concat, [1]] # 34-P6/64
  - [-1, 2, C3k2, [1024, True]] # 35-P6/64

  - [[26, 29, 32, 35], 1, Detect, [nc]] # 36-P3/8,P4/16,P5/32,P6/64
