# Ultralytics YOLO11 CTrans neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 2, C2PSA, [1024]] # 10-P5/32

head:
  - [[4, 6, 10], 1, ChannelTransformer, []] # 11-P3/8,P4/16,P5/32
  - [11, 1, GetIndexOutput, [0]] # 12-P3/8
  - [11, 1, GetIndexOutput, [1]] # 13-P4/16
  - [11, 1, GetIndexOutput, [2]] # 14-P5/32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15-P4/16
  - [[-1, 6], 1, Concat, [1]] # 16-P4/16
  - [-1, 2, C3k2, [512, False]] # 17-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 18-P3/8
  - [[-1, 4], 1, Concat, [1]] # 19-P3/8
  - [-1, 2, C3k2, [256, False]] # 20-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 21-P4/16
  - [[-1, 17], 1, Concat, [1]] # 22-P4/16
  - [-1, 2, C3k2, [512, False]] # 23-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 24-P5/32
  - [[-1, 14], 1, Concat, [1]] # 25-P5/32
  - [-1, 2, C3k2, [1024, True]] # 26-P5/32

  - [[20, 23, 26], 1, Detect, [nc]] # 27-P3/8,P4/16,P5/32
