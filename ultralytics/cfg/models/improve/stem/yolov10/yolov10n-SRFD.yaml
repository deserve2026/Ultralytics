# YOLOv10n object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov10
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov10n.yaml' uses the 'n' scale
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, SRFD, [128]] # 0-P2/4
  - [-1, 3, C2f, [128, True]] # 1-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 2-P3/8
  - [-1, 6, C2f, [256, True]] # 3-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 4-P4/16
  - [-1, 6, C2f, [512, True]] # 5-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 6-P5/32
  - [-1, 3, C2f, [1024, True]] # 7-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 8-P5/32
  - [-1, 1, PSA, [1024]] # 9-P5/32

# YOLOv10 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10-P4/16
  - [[-1, 5], 1, Concat, [1]] # 11-P4/16
  - [-1, 3, C2f, [512]] # 12-P4/16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13-P3/8
  - [[-1, 3], 1, Concat, [1]] # 14-P3/8
  - [-1, 3, C2f, [256]] # 15-P3/8
  - [-1, 1, Conv, [256, 3, 2]] # 16-P4/16
  - [[-1, 12], 1, Concat, [1]] # 17-P4/16
  - [-1, 3, C2f, [512]] # 18-P4/16
  - [-1, 1, SCDown, [512, 3, 2]] # 19-P5/32
  - [[-1, 9], 1, Concat, [1]] # 20-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]] # 21-P5/32
  - [[15, 18, 21], 1, v10Detect, [nc]] # 22-P3/8,P4/16,P5/32
