# Ultralytics YOLOv8 CGAFusion neck model with P3/8 - P5/32 outputs

# Parameters
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10-P4/16
  - [[-1, 6], 1, Concat, [1]] # 11-P4/16
  - [-1, 3, C2f, [512]] # 12-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13-P3/8
  - [[-1, 4], 1, Concat, [1]] # 14-P3/8
  - [-1, 3, C2f, [256]] # 15-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 16-P4/16
  - [[-1, 12], 1, Concat, [1]] # 17-P4/16
  - [-1, 3, C2f, [512]] # 18-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 19-P5/32
  - [[-1, 9], 1, Concat, [1]] # 20-P5/32
  - [-1, 3, C2f, [1024]] # 21-P5/32

  - [[4, 15], 1, CGAFusion, [256]] # 22-P3/8
  - [[6, 18], 1, CGAFusion, [512]] # 23-P4/16
  - [[9, 21], 1, CGAFusion, [1024]] # 24-P5/32

  - [[22, 23, 24], 1, Detect, [nc]] # 25-P3/8,P4/16,P5/32
