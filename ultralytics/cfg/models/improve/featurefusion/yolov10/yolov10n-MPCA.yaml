# YOLOv10n object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov10
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov10n.yaml' uses the 'n' scale
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

# YOLOv10 head
head:
  - [[6, -1], 1, MultiScalePCA, [512]] # 11-P4/16
  - [-1, 3, C2f, [512]] # 12-P4/16

  - [[4, -1], 1, MultiScalePCA, [256]] # 13-P3/8
  - [-1, 3, C2f, [256]] # 14-P3/8

  - [[12, -1], 1, MultiScalePCA_Down, [512]] # 15-P4/16
  - [-1, 3, C2f, [512]] # 16-P4/16

  - [[10, -1], 1, MultiScalePCA_Down, [1024]] # 17-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]] # 18-P5/32

  - [[14, 16, 18], 1, v10Detect, [nc]] # 19-P3/8,P4/16,P5/32
