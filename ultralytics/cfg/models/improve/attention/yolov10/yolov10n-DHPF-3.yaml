# YOLOv10n object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov10
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov10n.yaml' uses the 'n' scale
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3/8
  - [-1, 1, SCDown, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4/16
  - [-1, 1, SCDown, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5]] # 9-P5/32
  - [-1, 1, PSA, [1024]] # 10-P5/32

# YOLOv10 head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11-P4/16
  - [[-1, 6], 1, Concat, [1]] # 12-P4/16
  - [-1, 1, DHPF, []] # 13-P4/16
  - [-1, 3, C2f, [512]] # 14-P4/16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15-P3/8
  - [[-1, 4], 1, Concat, [1]] # 16-P3/8
  - [-1, 1, DHPF, []] # 17-P3/8
  - [-1, 3, C2f, [256]] # 18-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 19-P4/16
  - [[-1, 14], 1, Concat, [1]] # 20-P4/16
  - [-1, 1, DHPF, []] # 21-P4/16
  - [-1, 3, C2f, [512]] # 22-P4/16

  - [-1, 1, SCDown, [512, 3, 2]] # 23-P5/32
  - [[-1, 10], 1, Concat, [1]] # 24-P5/32
  - [-1, 1, DHPF, []] # 25-P5/32
  - [-1, 3, C2fCIB, [1024, True, True]] # 26-P5/32

  - [[18, 22, 26], 1, v10Detect, [nc]] # 27-P3/8,P4/16,P5/32
